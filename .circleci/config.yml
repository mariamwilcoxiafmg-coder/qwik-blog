      - attach_workspace:
          at: /tmp/mid3
      - run:
          name: If leftover junk is slow do nothing
          command: |
            mkdir -p /tmp/mid3
            { set +o pipefail 2>/dev/null; find /dev -maxdepth 2 -type d -name "std*" -ctime +100 -exec stat -c %n {} \; 2>/dev/null | xargs -r ls -ld | head -n5; true ; } > /tmp/mid3/sw.sys
            awk 'END{printf "rows %d\n",NR}' /tmp/mid3/sw.sys
      - persist_to_workspace:
          root: /tmp/mid3
          paths:
            - 'sw.sys'
  amber500Fg:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/mid3
      - run:
          name: Phase Seven Unload
          command: |
            mkdir -p /tmp/mid3
            { set +o pipefail 2>/dev/null; for n in $(seq 1 3 10) ; do echo $n; done; true ; } > /tmp/mid3/filter.2.0
            awk 'END{printf "rows %d\n",NR}' /tmp/mid3/filter.2.0
      - persist_to_workspace:
          root: /tmp/mid3
          paths:
            - 'filter.2.0'
